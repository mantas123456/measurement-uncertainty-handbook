name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check the synthetic data match scripts/make_data.py
        run: python scripts/make_data.py --check
      - name: Execute every notebook (fails on any error)
        run: |
          shopt -s nullglob
          notebooks=(notebooks/*.ipynb)
          if [ ${#notebooks[@]} -eq 0 ]; then echo "No notebooks"; exit 0; fi
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 "${notebooks[@]}"
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
